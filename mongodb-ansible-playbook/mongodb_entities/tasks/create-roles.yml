---
# Create custom roles on the primary. Roles are created BEFORE users so that
# users created in the same run can reference them.

- name: Create custom MongoDB roles on the primary
  community.mongodb.mongodb_role:
    login_host: "127.0.0.1"
    login_port: "{{ mongo_conn.port }}"
    login_user: "{{ mongo_conn.user | default(omit, true) }}"
    login_password: "{{ mongo_conn.password | default(omit, true) }}"
    login_database: "{{ mongo_conn.authsource | default('admin') }}"
    ssl: "{{ mongo_conn.tls | default(false) }}"
    name: "{{ item.name }}"
    database: "{{ item.db }}"
    privileges: "{{ item.privileges | default([]) }}"
    roles: "{{ item.roles | default([]) }}"
    state: present
  loop: "{{ mongodb_roles | default([]) }}"
  loop_control:
    label: "{{ item.db }}.{{ item.name }}"
  when: is_primary | bool
  vars:
    ansible_python_interpreter: "{{ mongodb_venv_python }}"
  tags: ["roles"]
