    #       - "'rs0' in rs_auth_test.transformed_output"
    #     fail_msg: "REPLICA SET AUTH FAILED: Cannot access replica set status"
    #     success_msg: "✓ Replica set authentication working"
    #   when: inventory_hostname in groups['primary']
    # - debug:
    #     msg: "Replicaset Information: {{ rs_auth_test.transformed_output }}"

    # - name: Test invalid credentials (should fail)
    #   community.mongodb.mongodb_info:
    #     login_user: admin
    #     login_password: "{{ wrong_password }}"
    #     login_database: admin
    #     login_host: "{{ primary }}"
    #     login_port: "{{ mongodb_port }}"
    #   register: invalid_auth_test
    #   failed_when: false

    # - name: Verify invalid credentials are rejected
    #   assert:
    #     that:
    #       - invalid_auth_test is failed
    #     fail_msg: "SECURITY ISSUE: Invalid credentials accepted!"
    #     success_msg: "✓ Invalid credentials properly rejected"

  rescue:
    - name: Authentication test failed
      debug:
        msg: "Authentication/Authorization tests failed. Check MongoDB configuration and credentials."
      
    - name: Display auth test results
      debug:
        var: item
      loop:
        - "{{ unauth_test }}"
        - "{{ auth_test }}"
        - "{{ invalid_auth_test }}"
      when: item is defined

  when: inventory_hostname in groups.get('primary', [])
  vars:
    ansible_python_interpreter: /opt/mongodb-venv/bin/python
  tags: ["security", "authentication", "testing", "all"]
