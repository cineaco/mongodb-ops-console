---
# Authentication and Authorization Testing Tasks
- name: Test Authentication & Authorization
  block:
    - name: Test connection without authentication (should fail)
      community.mongodb.mongodb_shell:
        login_host: "{{ primary }}" #"{{ ansible_default_ipv4.address }}"
        login_port: "{{ mongodb_port }}"
        eval: "rs.status()"
      register: unauth_test
      failed_when: false

    - name: Verify unauthenticated access is denied
      assert:
        that:
          - unauth_test is succeeded
        fail_msg: "SECURITY ISSUE: Unauthenticated access is allowed!"
        success_msg: "Unauthenticated access properly denied"
      failed_when: unauth_test is failed

    - name: Test authentication with admin user
      community.mongodb.mongodb_info:
        login_user: admin
        login_password: "{{ admin_password }}"
        login_database: admin
        login_host: "{{ primary }}"
        login_port: "{{ mongodb_port }}"
      register: auth_test
      when:
        - inventory_hostname in groups['primary']

    - name: Verify authenticated access works
      assert:
        that:
          - auth_test is succeeded
        fail_msg: "AUTHENTICATION FAILED: Admin user cannot authenticate"
        success_msg: "✓ Admin authentication successful"

    - name: Test admin user permissions
      community.mongodb.mongodb_shell:
        login_user: admin
        login_password: "{{ admin_password }}"
        login_database: admin
        login_host: "{{ primary }}"
        login_port: "{{ mongodb_port }}"
        eval: "db.adminCommand('listDatabases')"
      register: permissions_test
      when: inventory_hostname in groups['primary']

    - name: Verify admin has proper permissions
      assert:
        that:
          - permissions_test is succeeded
        fail_msg: "AUTHORIZATION FAILED: Admin user lacks proper permissions"
        success_msg: "✓ Admin user has proper permissions"

    # - name: Test replica set authentication
