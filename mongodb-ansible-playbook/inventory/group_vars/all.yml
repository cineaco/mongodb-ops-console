##################################################
##  USER CONFIGURATION - UPDATE BEFORE DEPLOY   ##
##################################################
# These variables override role defaults.
# Only set what you need to change.

# MongoDB Version
mongodb_version: "7.0"

# MongoDB Port (non-standard default: 37017)
mongodb_port: 37017

# Replica Set
replicaset_name: "rs0"
single_node_replicaset: false

# Replica Set Priorities
primary_priority: 1
secondary_priority: 1
secondary2_priority: 1
arbiter_priority: 0
percona_primary_priority: 1
percona_priority: 1

# Replica Set Votes
primary_votes: 1
secondary_votes: 1
secondary2_votes: 1
arbiter_votes: 1
percona_primary_votes: 1
percona_votes: 1

# Admin Credentials (use ansible-vault to encrypt this file)
create_admin_user: false
admin_username: admin
admin_password: "CHANGE_ME"

# Application Database
application_database_create: false
application_database: "myapp"
application_user: "app_user"
application_password: "CHANGE_ME"
application_role:
  - readWrite

# Storage
enable_external_volume: false
filesystem: xfs
mount_path: /datadrive
external_volume: /dev/nvme1n1
volume_size_gb: 100        # Informational; document the attached disk size

# Oplog
oplogSizeMB: 1024

# Slack Notifications
slack_enabled: false
# slack_token: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

# Monitoring
enable_monitoring: false
# monitoring_password: "CHANGE_ME"   # encrypt with ansible-vault

# Standalone mode (single node, no replica set)
standalone_mode: true

# Slack channel (only needed for bot-token delivery, not webhook)
slack_channel: ""

# Percona Backup
backup_enabled: false
pbm_user_password: "CHANGE_ME"
percona_backup_s3_bucket: "your-s3-bucket"
highest_priority: 3
backup_prefix: pbm
